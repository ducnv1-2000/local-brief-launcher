<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEWS-BOT Local Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
:root{--navy:#0d1f3c;--navy2:#16325e;--amber:#f5a524;--ink:#16202e;--dim:#5b6676;--line:#dfe4ec;--paper:#f2f4f8}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#0a1426;color:var(--ink);font:15px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 12px 40px}
a{color:#1f5fbf}
button{font:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:2000;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1080px;margin:0 auto;padding:10px 0;background:#0a1426}
.bar .home{color:#fff;font:800 18px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-decoration:none}
.bar .home b{color:var(--amber)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actions button{border:0;border-radius:8px;padding:9px 14px;font:600 14px Barlow,sans-serif;background:#223454;color:#fff}
.actions button.primary{background:var(--amber);color:#1b1204}
.actions button:focus-visible,.card:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.poster{max-width:1080px;margin:0 auto;background:var(--paper);overflow:hidden}
.mast{position:relative;color:#fff;background:#0d1f3c center/cover no-repeat;min-height:290px;padding:30px 34px 26px;display:flex;justify-content:space-between;gap:24px}
.mast::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,18,38,.9) 0%,rgba(8,18,38,.5) 48%,rgba(8,18,38,.88) 100%)}
.mast>*{position:relative}
.logo{margin:0;font:800 92px/.88 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.005em}
.logo span{display:block;color:var(--amber)}
.tagline{margin:16px 0 0;font:600 13px/1.7 Barlow,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#a9c8ff}
.cats{align-self:flex-start;border-left:3px solid var(--amber);padding-left:14px;font:600 12px/1.95 Barlow,sans-serif;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.credit{position:absolute;right:10px;bottom:6px;font-size:10px;color:rgba(255,255,255,.72)}
.credit a{color:inherit}
.ribbon{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;text-align:center;padding:14px 20px;font:700 32px/1.15 "Barlow Condensed",sans-serif;border-top:3px solid var(--amber)}
.dateline{text-align:center;padding:12px 20px 0;font:700 21px/1.2 "Barlow Condensed",sans-serif;color:var(--navy);letter-spacing:.02em}
.dateline small{display:block;margin-top:2px;font:500 12.5px Barlow,sans-serif;color:var(--dim);letter-spacing:0}
.sum{margin:12px 22px 0;padding:11px 16px;background:#fff;border-radius:8px;font-size:15.5px;text-align:center;color:#253041}

.top{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:16px;padding:16px 22px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 22px 16px}
.card{position:relative;background:#fff;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(13,31,60,.08),0 6px 18px rgba(13,31,60,.08);cursor:pointer;transition:box-shadow .15s}
.card.hi{box-shadow:0 0 0 3px var(--amber),0 6px 18px rgba(13,31,60,.16)}
.chead{background:var(--c);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;font:800 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase}
.chead svg{width:26px;height:26px;flex:none}
.cbody{position:relative;padding:12px 16px 14px;flex:1;display:flex;flex-direction:column;gap:7px}
.hl{margin:0;font:700 23px/1.1 "Barlow Condensed",sans-serif;color:var(--ink)}
.note{margin:0;font-size:14.5px;color:#2d3846}
.row{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;color:#253041}
.row svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--c)}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;margin-right:7px;border-radius:11px;background:var(--c,var(--navy));color:#fff;font:700 12px/1 Barlow,sans-serif;vertical-align:3px}
.badge{align-self:flex-start;padding:3px 9px;border-radius:999px;font:700 11px/1.4 Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:#eef1f5;color:var(--dim)}
.badge:empty{display:none}
.badge.now{background:#e03c31;color:#fff}.badge.next{background:#fff1d6;color:#8a5a00}.badge.end{background:#e8ebf0;color:#8a93a0}
.check{font-size:12.5px;color:#a3281e;font-weight:600}
.more{margin-top:4px;padding-top:9px;border-top:1px dashed var(--line);display:grid;gap:7px;font-size:14px}
.more div{display:flex;align-items:flex-start}
.more div .num{flex:none;margin-top:-1px}
.links{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.links a{text-decoration:none}
.wm{position:absolute;right:-16px;bottom:-16px;width:120px;height:120px;color:var(--c);opacity:.07;pointer-events:none}
.wm svg{width:100%;height:100%}
.card.empty{cursor:default}.card.empty .hl{color:var(--dim);font-size:20px}

.mapcell{position:relative;min-height:440px;border-radius:10px;overflow:hidden;background:#dde3ea;box-shadow:0 1px 2px rgba(13,31,60,.08),0 6px 18px rgba(13,31,60,.08)}
#map{position:absolute;inset:0}
.north{position:absolute;top:10px;right:10px;z-index:500;background:#fff;border-radius:8px;padding:5px 8px 4px;text-align:center;font:800 13px/1 "Barlow Condensed",sans-serif;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.north svg{display:block;width:14px;height:14px;margin:0 auto 1px}
.nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--dim)}
.pinwrap{background:none;border:0}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--c);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;white-space:nowrap;font:700 12.5px/1 Barlow,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.hi{box-shadow:0 0 0 4px var(--amber),0 2px 6px rgba(0,0,0,.35)}
.homepin{position:absolute;left:-12px;top:-30px;width:24px;height:24px;background:#e03c31;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.leaflet-tooltip.plabel,.leaflet-tooltip.here{border:0;border-radius:6px;padding:4px 8px;font:700 12.5px/1.2 Barlow,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.3);color:#fff}
.leaflet-tooltip.plabel{background:var(--navy)}
.leaflet-tooltip.here{background:#e03c31;text-align:center}
.leaflet-tooltip.plabel small,.leaflet-tooltip.here small{display:block;font-weight:500;opacity:.9}
.leaflet-tooltip.plabel::before,.leaflet-tooltip.here::before{display:none}
.pop{font:14px/1.4 Barlow,sans-serif;min-width:180px}
.pop b{display:block;margin-bottom:6px;font-size:15px}
.pop div{display:flex;align-items:flex-start;margin-top:5px;cursor:pointer}

.wt .wxrow{display:flex;align-items:center;gap:14px}
.wt .wxicon{width:58px;height:58px;color:#e59a00;flex:none}
.wt .wxicon svg{width:100%;height:100%}
.wt .temp{font:800 56px/1 "Barlow Condensed",sans-serif;color:var(--c)}
.wt .temp small{margin-left:8px;font:700 22px "Barlow Condensed",sans-serif;color:var(--dim)}
.wt .sky{font:700 18px/1.15 "Barlow Condensed",sans-serif}
.wt .sep{height:1px;background:var(--line);margin:6px 0}
.tr{display:flex;align-items:flex-start;gap:4px;font-size:14.5px}
.tr .num{flex:none}

.nearby{margin:0 22px 18px;padding:12px 16px;background:#fff;border-radius:10px}
.nearby h4{margin:0 0 8px;font:800 17px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.nearby ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:7px 18px}
.nearby li{display:flex;align-items:flex-start;cursor:pointer;font-size:14px}
.nearby li .num{flex:none}

.foot{background:linear-gradient(135deg,#081328,#132a52);color:#fff;text-align:center;padding:26px 20px 18px}
.foot .big{font:600 40px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.08em}
.foot .rule{width:80px;height:3px;background:var(--amber);margin:12px auto}
.foot .small{font:600 12px Barlow,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#a9c8ff}
.foot .src{margin:16px auto 0;max-width:900px;font-size:11.5px;line-height:1.6;color:#b8c4d8}
.foot .src a{color:#dbe6f8}

.landing{max-width:640px;margin:48px auto;padding:26px;background:var(--paper);border-radius:12px}
.landing .logo{font-size:56px;color:var(--navy)}
.landing p{font-size:16px}
.landing textarea{width:100%;min-height:150px;padding:12px;border:1px solid #c9d2de;border-radius:8px;font:13px/1.5 ui-monospace,Menlo,monospace}
.landing .btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.landing button{border:0;border-radius:8px;padding:10px 16px;font:600 15px Barlow,sans-serif;background:var(--navy);color:#fff}
.landing button.primary{background:var(--amber);color:#1b1204}
.err{color:#a3281e;font-weight:600}
.loading{margin:90px 0;text-align:center;color:#fff;font:700 24px "Barlow Condensed",sans-serif;letter-spacing:.04em}
.warnbar{max-width:1080px;margin:0 auto 10px;padding:10px 14px;border-radius:8px;background:#fff1d6;color:#5c3d00;font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3000;background:#16202e;color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#busy{position:fixed;inset:0;z-index:2500;background:rgba(10,20,38,.82);color:#fff;display:flex;align-items:center;justify-content:center;font:700 20px "Barlow Condensed",sans-serif;letter-spacing:.06em}
body.export{overflow:hidden}
body.export .poster{width:1080px;max-width:none}

@media(max-width:820px){
  body:not(.export) .mast{flex-direction:column;min-height:0;padding:24px 20px 22px}
  body:not(.export) .logo{font-size:60px}
  body:not(.export) .tagline{font-size:11px;letter-spacing:.24em}
  body:not(.export) .cats{border-left:0;border-top:3px solid var(--amber);padding:8px 0 0;white-space:normal;line-height:1.7}
  body:not(.export) .ribbon{font-size:25px}
  body:not(.export) .top,body:not(.export) .bottom{grid-template-columns:1fr;padding-left:14px;padding-right:14px}
  body:not(.export) .mapcell{order:-1;min-height:340px}
  body:not(.export) .sum,body:not(.export) .nearby{margin-left:14px;margin-right:14px}
  body:not(.export) .foot .big{font-size:28px}
  body:not(.export) .cats{display:none}
}
@media(max-width:520px){
  .bar .home{display:none}
  .bar{justify-content:flex-end}
  .actions button{padding:8px 11px;font-size:13.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const nums = s => String(s || "").split(",").map(x => parseFloat(x)).filter(x => !isNaN(x));

async function loadPhoto(D) {
  const base = "https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail|name&pithumbsize=1600&format=json&origin=*&redirects=1";
  const tries = [];
  if (D.photo) tries.push(base + "&titles=" + encodeURIComponent(D.photo.replace(/ /g, "_")));
  tries.push(base + "&generator=search&gsrlimit=1&gsrsearch=" + encodeURIComponent(D.loc));
  const city = D.loc.split(",").slice(-1)[0].trim();
  if (city && city !== D.loc) tries.push(base + "&titles=" + encodeURIComponent(city));
  for (const u of tries) {
    try {
      const j = await (await fetch(u)).json();
      const p = Object.values((j.query && j.query.pages) || {}).find(p => p.thumbnail);
      if (p) {
        $("mast").style.backgroundImage = `url("${p.thumbnail.source}")`;
        $("credit").innerHTML = `<a href="https://en.wikipedia.org/wiki/File:${encodeURIComponent(p.pageimage)}" target="_blank" rel="noopener">Photo: Wikimedia Commons</a>`;

  }

  $("go").onclick = () => {
    const raw = $("paste").value, D = parse(raw);
    if (!D) { landing("That doesn't look like a brief. Paste the whole link, or the data that starts with loc="); return; }
    let q = raw.trim(); const h = q.indexOf("#"); if (h >= 0) q = q.slice(h + 1);
    location.hash = q.replace(/\s*\n\s*/g, "&");
  };
  $("clip").onclick = async () => {
    try { $("paste").value = await navigator.clipboard.readText(); } catch (e) { toast("Your browser blocked clipboard access. Paste into the box instead."); }
  };
}

async function photon(q, near) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3500);
  try {
    const u = "https://photon.komoot.io/api/?limit=1&q=" + encodeURIComponent(q) + (near && near.lat != null ? `&lat=${near.lat}&lon=${near.lon}` : "");
    const j = await (await fetch(u, { signal: ctl.signal })).json();
    const f = j.features && j.features[0];
    if (!f) return null;
    const p = { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] };
    if (near && near.lat != null && dist(near, p, false) > 60) return null;
    return p;
  } catch (e) { return null; } finally { clearTimeout(t); }
}
async function placeItems(D) {
  if (D.lat == null) { const p = await photon(D.loc, null); if (p) { D.lat = p.lat; D.lon = p.lon; } }
  const short = D.loc.split(",")[0].trim().toLowerCase();
  const city = D.loc.split(",").slice(-1)[0].trim();
  const cache = {};
  const jobs = D.items.filter(it => it.lat == null && it.venue && it.cat !== "transit").map(async it => {
    const v = it.venue.trim();
    if (D.lat != null && v.toLowerCase().includes(short)) { it.lat = D.lat; it.lon = D.lon; return; }
    const q = v.toLowerCase().includes(city.toLowerCase()) ? v : v + ", " + city;
    cache[q] = cache[q] || photon(q, D);
    const p = await cache[q];
    if (p) { it.lat = p.lat; it.lon = p.lon; it.geo = true; }
  });
  await Promise.race([Promise.all(jobs), wait(5000)]);
}
async function route() {
  const h = decodeURIComponent(location.hash.slice(1, 9)) === "example" ? EXAMPLE : location.hash.slice(1);
  if (!h) return landing("");
  const D = parse(h);
  if (!D) return landing("This link looks incomplete. Copy the whole link from your chat and paste it here.");
  $("bar").hidden = true;
  $("app").innerHTML = `<p class="loading">Building your brief…</p>`;
  await placeItems(D);
  render(D);
}
$("save").onclick = saveImage;
$("share").onclick = share;
$("copy").onclick = copyLink;
document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const pop = e.target.closest(".pop [data-n]");
  if (pop) return focusItem(+pop.dataset.n);
  const sub = e.target.closest(".more [data-n], .tr[data-n], .nearby [data-n]");
  if (sub) return focusItem(+sub.dataset.n);
  const card = e.target.closest(".card[data-n]");
  if (card) focusItem(+card.dataset.n);
});
document.addEventListener("keydown", e => {
  const card = e.target.closest && e.target.closest(".card[data-n]");
  if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); focusItem(+card.dataset.n); }
});
addEventListener("hashchange", route);
route();
})();
</script>
